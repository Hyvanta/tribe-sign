name: Update spot prices
on:
  schedule:
    - cron: '7 * * * *'        # every hour (GitHub may run it a few minutes late – the page holds ~2 days of data)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-prices.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain prices.json)" ]; then
            git config user.name "tribe-sign-bot"
            git config user.email "actions@users.noreply.github.com"
            git add prices.json
            git commit -m "Update spot prices"
            git push
          fi
